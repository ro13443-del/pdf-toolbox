<style>
:root {
  --bg: #dbdbdb; 
  --bg-panel: #f2f2f2;
  --surface: #ffffff; 
  --ink: #1a1a1a; 
  --muted: #757575; 
  --line: #cccccc; 
  --paper-stage: #e8e8e8;
  --warn: #a67c00; --warn-soft: #fffdf0;
  --shadow: 0 20px 40px -20px rgba(0,0,0,0.15);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* 基礎設定 */
html { scroll-padding-top: 80px; scroll-behavior: smooth; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans TC", sans-serif; font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
.container { max-width: 1400px; margin: 0 auto; padding: 0 40px; }
.serif { font-family: "Noto Serif TC", "Playfair Display", serif; }

/* 導覽列與手機左拉選單 */
.topnav { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.topnav .container { height: 80px; display: flex; align-items: center; justify-content: space-between; }
.logo-group { display: flex; align-items: center; gap: 40px; }
.logo { font-family: "Playfair Display", "Noto Serif TC", serif; font-weight: 700; font-size: 1.5rem; background: none; border: 0; cursor: pointer; padding: 0; letter-spacing: 0.05em; }
.logo-dots { font-size: 1.2rem; color: var(--ink); letter-spacing: 2px; }
.navlinks { display: flex; gap: 40px; margin-left: 60px; align-items: center; }
.navlinks button { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 400; font-size: 0.9rem; color: var(--muted); letter-spacing: 0.1em; transition: color 0.3s; font-family: "Noto Serif TC", serif; }
.navlinks button:hover { color: var(--ink); }
.nav-contact { background: none; border: 0; font-weight: 600; font-size: 0.85rem; font-family: "Playfair Display", serif; letter-spacing: 0.05em; cursor: pointer; border-left: 1px solid var(--line); padding: 30px 0 30px 40px; height: 100%; display: flex; align-items: center; text-transform: uppercase; }

/* 左拉選單 (Drawer) */
.hamburger { display: none; background: none; border: none; font-size: 1.8rem; cursor: pointer; color: var(--ink); padding: 0; margin-right: 20px; line-height: 1; }
.mobile-drawer { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background: var(--surface); z-index: 1000; box-shadow: 2px 0 20px rgba(0,0,0,0.15); transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 60px 40px; display: flex; flex-direction: column; gap: 30px; align-items: flex-start; overflow-y: auto; }
.mobile-drawer.open { left: 0; }
.drawer-close { position: absolute; top: 25px; right: 25px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); }
.drawer-link { background: none; border: none; font-size: 1.1rem; color: var(--muted); cursor: pointer; font-family: "Noto Serif TC", serif; padding: 0; transition: color 0.3s; letter-spacing: 0.05em; text-align: left; }
.drawer-link:hover, .drawer-link.active { color: var(--ink); font-weight: 600; }
.drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
.drawer-overlay.show { opacity: 1; pointer-events: auto; }

/* 安裝提示 Modal */
.install-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 20px; }
.install-modal.show { opacity: 1; pointer-events: auto; }
.im-content { background: var(--surface); padding: 40px; width: 100%; max-width: 500px; text-align: center; max-height: 90vh; overflow-y: auto; }

/* 首頁畫冊風格 (Hero Section) */
.editorial-hero { display: flex; min-height: calc(100vh - 80px); background: var(--bg); overflow: hidden; }
.hero-left { flex: 0 0 45%; background: var(--bg-panel); padding: 100px 80px; display: flex; flex-direction: column; justify-content: center; }
.hero-right { flex: 1; position: relative; background-color: #e0e0e0; display: flex; align-items: center; justify-content: center; overflow: hidden; background-image: url('bg.jpg'); background-size: cover; background-position: center; }
.hero-right::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(232,232,232,0.75) 0%, rgba(213,213,213,0.9) 100%); z-index: 0; }
.hero-subtitle { font-size: 0.85rem; letter-spacing: 0.2em; color: var(--ink); margin-bottom: 20px; font-family: "Playfair Display", serif; text-transform: uppercase; opacity: 0.8;}
.hero-title { font-size: 4vw; font-weight: 500; line-height: 1.2; letter-spacing: 0.05em; margin-bottom: 30px; color: var(--ink); font-family: "Noto Serif TC", serif; }
.hero-desc { color: var(--muted); font-size: 1rem; max-width: 400px; line-height: 1.8; margin-bottom: 60px; }
.hero-discover { display: flex; align-items: center; gap: 20px; }
.outline-text { font-family: "Playfair Display", serif; font-size: 4rem; font-weight: 400; letter-spacing: 0.05em; color: transparent; -webkit-text-stroke: 1px rgba(0,0,0,0.2); text-transform: uppercase; }
.thin-arrow { font-size: 3rem; font-weight: 100; color: rgba(0,0,0,0.2); margin-top: 10px; }

/* 疊加的精選卡片 */
.featured-card { position: relative; z-index: 2; width: 340px; background: var(--surface); box-shadow: var(--shadow); padding: 0; transform: translateY(20px); }
.fc-img { width: 100%; height: 260px; background-color: #ececec; display: flex; align-items: center; justify-content: center; overflow: hidden; background-image: url('card.jpg'); background-size: cover; background-position: center; }
.fc-img::after { content: "P."; font-family: "Playfair Display", serif; font-size: 100px; color: #fff; opacity: 0.3; font-style: italic; }
.fc-content { padding: 40px; }
.fc-title { font-family: "Noto Serif TC", serif; font-size: 1.2rem; letter-spacing: 0.05em; margin-bottom: 15px; }
.fc-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.6; margin-bottom: 30px; }
.fc-link { font-size: 0.8rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--muted); text-decoration: none; border: none; background: none; padding: 0; }
.fc-link:hover { color: var(--ink); }

.stamp { position: absolute; top: 40px; left: 40px; z-index: 3; width: 120px; height: 120px; animation: rotate 20s linear infinite; opacity: 0.3; pointer-events: none; }
@keyframes rotate { 100% { transform: rotate(360deg); } }

/* 首頁工具列表 */
.tools-section { background: var(--bg); padding: 100px 0; }
.tools-header { text-align: center; margin-bottom: 80px; }
.tools-header h2 { font-size: 2rem; letter-spacing: 0.05em; font-family: "Noto Serif TC", serif; }

.filters { display: flex; justify-content: center; gap: 40px; margin-bottom: 60px; }
.pill { background: none; border: none; font-size: 0.95rem; letter-spacing: 0.1em; color: var(--muted); cursor: pointer; padding: 10px 0; position: relative; font-family: "Noto Serif TC", serif; }
.pill[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
.pill[aria-pressed="true"]::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 1px; background: var(--ink); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.tile { background: var(--surface); padding: 40px; cursor: pointer; text-align: left; border: none; position: relative; transition: background 0.3s; display: flex; flex-direction: column; justify-content: space-between; min-height: 240px; }
.tile:hover { background: var(--bg-panel); }
.tile-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;}
.tile-title { font-family: "Noto Serif TC", serif; font-size: 1.25rem; font-weight: 600; letter-spacing: 0.05em; display: block;}
.tile-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
.tile .new { font-size: 0.65rem; letter-spacing: 0.1em; border: 1px solid var(--ink); padding: 2px 6px; font-family: "Playfair Display", serif;}

/* 內部工具頁 */
.tool-page { background: var(--bg); min-height: 100vh; }
.thero { padding: 40px 0 60px; text-align: center; border-bottom: 1px solid var(--line); background: var(--bg-panel); }
.thero h1 { font-family: "Noto Serif TC", serif; font-size: 2.5rem; letter-spacing: 0.05em; margin-bottom: 15px; }
.thero .lede { color: var(--muted); font-size: 1rem; max-width: 600px; margin: 0 auto; line-height: 1.8; }
.steps { list-style: none; display: flex; justify-content: center; gap: 40px; padding: 0; margin: 40px 0 0; }
.step { font-size: 0.9rem; letter-spacing: 0.05em; color: var(--muted); display: flex; align-items: center; gap: 10px; font-family: "Noto Serif TC", serif;}
.step.on { color: var(--ink); font-weight: 600; }
.step.done { color: var(--ink); }

.stage { max-width: 1200px; margin: 60px auto; padding: 0 40px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 0; box-shadow: var(--shadow); }
.upload { padding: 60px; text-align: center; }
.dropzone { border: 1px dashed var(--line); padding: 80px 40px; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.dropzone.over { border-color: var(--ink); background: var(--bg-panel); }

/* 按鈕與表單 (直角設計) */
.btn { font-family: inherit; font-size: 0.9rem; letter-spacing: 0.05em; padding: 15px 30px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; transition: all 0.3s; border-radius: 0; font-family: "Noto Sans TC", sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 8px;}
.btn:hover:not(:disabled) { background: var(--bg-panel); }
.btn.primary { background: var(--ink); color: #fff; }
.btn.primary:hover:not(:disabled) { background: #333; }
.btn.big { padding: 20px 40px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn.warn { border-color: var(--warn); color: var(--warn); }
.btn.link { border: 0; background: none; color: var(--ink); padding: 6px 0; text-decoration: underline; text-underline-offset: 4px; }

.input, select, textarea { font: inherit; padding: 12px 15px; border: 1px solid var(--line); background: var(--surface); border-radius: 0; width: 100%; transition: border-color 0.3s; min-height: 48px; }
.input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; }
.field { margin-bottom: 25px; }
.field > label, .flabel { display: block; font-size: 0.9rem; letter-spacing: 0.05em; margin-bottom: 10px; color: var(--muted); font-family: "Noto Serif TC", serif; }
.choice { display: flex; gap: 15px; align-items: flex-start; padding: 20px; border: 1px solid var(--line); margin-bottom: 10px; cursor: pointer; transition: all 0.3s; }
.choice:hover { background: var(--bg-panel); }
.choice:has(input:checked) { border-color: var(--ink); }
.choice input { margin-top: 4px; accent-color: var(--ink); width: 18px; height: 18px; }
.check { display: flex; gap: 10px; align-items: center; cursor: pointer; min-height: 44px; margin-bottom:10px; }
.check input { width: 18px; height: 18px; accent-color: var(--ink); }
input[type=range] { accent-color: var(--ink); width: 100%; }
.seg { display: flex; border: 1px solid var(--line); padding: 2px; gap: 2px; background: var(--bg-panel); }
.seg button { flex: 1; border: 0; background: none; padding: 10px; cursor: pointer; font-size: 0.9rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* 工作區與預覽 */
.ws { display: grid; overflow: hidden; }
.ws-pages { grid-template-columns: minmax(0,1fr) 420px; }
.ws-preview { grid-template-columns: 500px minmax(0,1fr); }
.ws-main { padding: 40px; border-right: 1px solid var(--line); min-width: 0; }
.ws-side { background: var(--bg-panel); display: flex; flex-direction: column; min-width: 0; }
.ws-preview .ws-main { border-right: none; border-left: 1px solid var(--line); order: 2; }
.ws-preview .ws-side { order: 1; border-right: none; }

.sec-title { font-family: "Noto Serif TC", serif; font-size: 1.3rem; font-weight: 600; margin-bottom: 25px; letter-spacing: 0.05em; }
.filehead { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 30px; }
.filehead .nm { font-weight: 600; font-family: "Noto Serif TC", serif; font-size: 1.1rem; }
.filehead .mt { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

.viewer { flex: 1; display: flex; flex-direction: column; padding: 40px; gap: 20px; min-height: 420px; }
.vcap { font-size: 0.9rem; letter-spacing: 0.05em; color: var(--muted); display: flex; justify-content: space-between; font-family: "Noto Serif TC", serif; }
.vstage { flex: 1; background: var(--paper-stage); display: grid; place-items: center; padding: 20px; position: relative; min-height: 400px; overflow: hidden; border: 1px solid var(--line); }
.vstage canvas { display: block; max-width: 100%; height: auto !important; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
.vnav { display: flex; align-items: center; justify-content: center; gap: 20px; }
.vbtn { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; transition: background 0.3s; font-size: 1.2rem; }
.vbtn:hover:not(:disabled) { background: var(--bg-panel); }
.vlabel { font-size: 0.9rem; letter-spacing: 0.1em; font-family: "Playfair Display", serif;}
.actionbar { padding: 40px; border-top: 1px solid var(--line); background: var(--surface); }

/* 縮圖與列表清單 */
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
.thumb { border: 1px solid transparent; padding: 10px; text-align: center; cursor: pointer; position: relative; transition: all 0.2s; background: var(--surface); }
.thumb .img { height: 160px; display: grid; place-items: center; background: var(--bg-panel); margin-bottom: 10px; overflow: hidden; }
.thumb canvas, .thumb img.pv { max-width: 100%; max-height: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.3s ease; }
.thumb .label { font-size: 0.85rem; color: var(--muted); font-family: "Noto Serif TC", serif; }
.thumb.sel { border-color: var(--ink); background: var(--tint); }
.thumb.del { opacity: 0.4; }
.thumb .dup { position: absolute; top: 15px; left: 15px; font-size: 0.75rem; background: var(--warn); color: #fff; padding: 2px 8px; }
.thumb.isdup { border-color: var(--warn); }
.thumb .ctls { display: flex; gap: 5px; margin-top: 8px; justify-content: center; }
.ctl { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.ctl:hover:not(:disabled) { border-color: var(--ink); }

.list { display: grid; gap: 10px; }
.item { display: flex; align-items: center; gap: 15px; padding: 15px; border: 1px solid var(--line); background: var(--surface); }
.item .mini { width: 50px; height: 70px; background: var(--bg-panel); display: grid; place-items: center; flex: none; }
.item .mini canvas { max-width: 100%; max-height: 100%; }
.item .pos { font-family: "Playfair Display", serif; font-size: 1.2rem; width: 30px; text-align: center; }
.addmore { border: 1px dashed var(--line); padding: 20px; text-align: center; cursor: pointer; background: none; color: var(--ink); font-family: "Noto Serif TC", serif; font-size: 1rem; transition: background 0.3s; }
.addmore:hover { background: var(--bg-panel); }

/* 訊息與橫幅 */
.msg { white-space: pre-line; margin-top: 20px; font-size: 0.9rem; }
.msg.err { color: var(--err); }
.msg.info { color: var(--muted); }
.banner { padding: 15px 20px; border: 1px solid var(--line); margin-bottom: 20px; font-size: 0.9rem; display: none; }
.banner.show { display: flex; align-items: center; justify-content: space-between; }
.banner.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.banner.ok { background: var(--ok-soft); border-color: var(--ok); }
.note { font-size: 0.85rem; color: var(--muted); background: var(--bg-panel); padding: 15px; line-height: 1.6; border-left: 3px solid var(--line); }

/* OCR 專屬 */
.ocr-page { margin-top: 20px; border: 1px solid var(--line); background: var(--surface); }
.ocr-page .h { display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid var(--line); background: var(--bg-panel); font-family: "Noto Serif TC", serif; }
.ocr-page textarea { border: 0; min-height: 250px; padding: 20px; resize: vertical; }

.sitefoot { padding: 80px 0 60px; border-top: 1px solid var(--line); background: var(--surface); margin-top: 100px; }
.sitefoot .container { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 40px; }
.sitefoot .logo { font-size: 1.5rem; margin-bottom: 15px; }
.sitefoot ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 15px 40px; }
.sitefoot a, .sitefoot button { background: none; border: 0; color: var(--muted); font-size: 0.9rem; letter-spacing: 0.05em; cursor: pointer; padding: 0; font-family: "Noto Serif TC", serif; text-align: left; }
.sitefoot a:hover, .sitefoot button:hover { color: var(--ink); }

#toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 15px 30px; font-size: 0.9rem; letter-spacing: 0.05em; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100; font-family: "Noto Serif TC", serif; }
#toast.show { opacity: 1; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.render-host { position: absolute; left: -100000px; top: 0; background: #fff; color: #000; }
.sheet { font-family: "Noto Sans TC", sans-serif; color: #000; background: #fff; display: inline-block; min-width: 100%; }
.sheet h2 { font-size: 15px; margin: 0 0 8px; font-weight: 700; }
.sheet table { border-collapse: collapse; table-layout: fixed; }
.sheet td { padding: 1px 4px; line-height: 1.25; vertical-align: bottom; overflow: visible; color: #000; }

/* ==========================================
   手機版與平板 RWD 響應式設計
   ========================================== */
@media (max-width: 900px) {
  .editorial-hero { flex-direction: column; min-height: auto; }
  .hero-left, .hero-right { flex: none; width: 100%; padding: 60px 30px; }
  .hero-right { min-height: 400px; }
  .hero-title { font-size: 3rem; }
  
  .hamburger { display: block; }
  .navlinks { display: none; }
  .nav-back { display: none; }
  .logo-group { gap: 0; }
  .nav-contact { border-left: none; padding-left: 0; }
  
  .filters { flex-wrap: wrap; gap: 15px; justify-content: flex-start; }
  .featured-card { width: 100%; transform: translateY(0); margin-top: 40px; }
  
  .ws-pages, .ws-preview { grid-template-columns: 1fr; }
  .ws-main { border-right: none !important; border-bottom: 1px solid var(--line); padding: 20px; }
  .ws-preview .ws-main { border-left: none; order: 1; }
  .ws-preview .ws-side { order: 2; }
  
  .container { padding: 0 20px; }
  .tools-section { padding: 60px 0; }
  .dropzone { padding: 40px 20px; }
  
  .sitefoot .container { flex-direction: column; gap: 30px; }
}
@media (max-width: 480px) {
  .hero-title { font-size: 2.5rem; }
  .outline-text { font-size: 2.5rem; }
  .thumb { width: 100%; }
}
</style>
</head>
<body>
<div id="app"><div class="container"><p style="padding: 100px 0; text-align: center; color: var(--muted); font-family:'Playfair Display', serif; letter-spacing: 0.1em;">INITIALIZING SYSTEM...</p></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- 安裝引導 Modal (詳細圖文版) -->
<div id="install-modal" class="install-modal">
  <div class="im-content">
    <h3 class="serif" style="margin-bottom:25px; font-size:1.5rem;">安裝為原生 App</h3>
    
    <div style="background:var(--bg-panel); padding:20px; text-align:left; margin-bottom:15px; border-left:4px solid var(--ink);">

<script>
'use strict';

/* --- PDF-Lib 核心邏輯 --- */
function makeCore(PDFLib){
  const { PDFDocument, degrees, pushGraphicsState, popGraphicsState, concatTransformationMatrix } = PDFLib;
  class UserError extends Error {}
  const norm = a => (((Math.round(a / 90) * 90) % 360) + 360) % 360;
  async function load(bytes){
    try { return await PDFDocument.load(bytes, { updateMetadata:false }); }
    catch(e){ throw new UserError('這個檔案無法讀取，可能受密碼保護或已損壞。'); }
  }
  async function merge(list, onProgress){
    const out = await PDFDocument.create();
    for (let k = 0; k < list.length; k++){
      if (onProgress) onProgress(k + 1, list.length);
      const src = await load(list[k]);
      const pages = await out.copyPages(src, src.getPageIndices());
      pages.forEach(p => out.addPage(p));
    }
    return out.save();
  }
  function addRotation(page, add){ if (add) page.setRotation(degrees(norm(page.getRotation().angle + add))); }
  async function pick(bytes, items){
    const src = await load(bytes); const out = await PDFDocument.create();
    const pages = await out.copyPages(src, items.map(x => x.i));
    pages.forEach((p, k) => { addRotation(p, items[k].rot || 0); out.addPage(p); });
    return out.save();
  }
  async function pickMany(bytes, groups, onProgress){
    const src = await load(bytes); const results = [];
    for (let g = 0; g < groups.length; g++){
      if (onProgress) onProgress(g + 1, groups.length);
      const out = await PDFDocument.create();
      const pages = await out.copyPages(src, groups[g]);
      pages.forEach(p => out.addPage(p)); results.push(await out.save());
    }
    return results;
  }
  function parseRanges(str, max){
    const text = String(str || '').replace(/[，、；;]/g, ',').replace(/[～~–—－]/g, '-').replace(/\s+/g, '');
    if (!text) throw new UserError('請輸入頁碼，例如：1-3, 5');
    const groups = [];
    for (const part of text.split(',')){
      if (!part) continue;
      const m = part.match(/^(\d+)(?:-(\d+))?$/);
      if (!m) throw new UserError(`「${part}」格式錯誤，請用像「1-3, 5」的寫法。`);
      const a = parseInt(m[1], 10), b = m[2] ? parseInt(m[2], 10) : a;
      if (a < 1 || b < 1 || a > max || b > max) throw new UserError(`「${part}」超出範圍，這份檔案只有 ${max} 頁。`);
      if (a > b) throw new UserError(`「${part}」起點要小於終點，例如「3-5」。`);
      const g = []; for (let i = a; i <= b; i++) g.push(i - 1); groups.push(g);
    }
    if (!groups.length) throw new UserError('請輸入頁碼。');
    return groups;
  }
  function visualMatrix(R, box){
    const { x, y, width:W, height:H } = box;
    switch (R){
      case 90:  return [0, 1, -1, 0, x + W, y];
      case 180: return [-1, 0, 0, -1, x + W, y + H];
      case 270: return [0, -1, 1, 0, x, y + H];
      default:  return [1, 0, 0, 1, x, y];
    }
  }
  async function stamp(bytes, fn, onProgress){
    const doc = await load(bytes); const pages = doc.getPages(); const cache = new Map();
    for (let i = 0; i < pages.length; i++){
      if (onProgress) onProgress(i + 1, pages.length);
      const page = pages[i]; const box = page.getCropBox(); const R = norm(page.getRotation().angle);
      const vw = (R % 180) ? box.height : box.width, vh = (R % 180) ? box.width : box.height;
      const items = await fn(i, pages.length, vw, vh);
      if (!items || !items.length) continue;
      try {
        page.node.normalize();
        const start = doc.context.register(doc.context.contentStream([pushGraphicsState()]));
        const end = doc.context.register(doc.context.contentStream([popGraphicsState()]));
        page.node.wrapContentStreams(start, end);
      } catch(e){}
      page.pushOperators(pushGraphicsState(), concatTransformationMatrix(...visualMatrix(R, box)));
      for (const it of items){
        let img = cache.get(it.key);
        if (!img){ img = await doc.embedPng(it.png); cache.set(it.key, img); }
        page.drawImage(img, { x:it.x, y:it.y, width:it.w, height:it.h, opacity: it.opacity == null ? 1 : it.opacity });
      }
      page.pushOperators(popGraphicsState());
    }
    return doc.save();
  }
  async function imagesToPdf(imgs, opts, onProgress){
    const doc = await PDFDocument.create(); const A4 = [595.28, 841.89]; const m = opts.margin || 0;
    for (let k = 0; k < imgs.length; k++){
      if (onProgress) onProgress(k + 1, imgs.length);
      const im = imgs[k];
      const e = im.kind === 'png' ? await doc.embedPng(im.bytes) : await doc.embedJpg(im.bytes);
      const iw = im.w * 0.75, ih = im.h * 0.75; let pw, ph;
      if (opts.size === 'fit'){ pw = iw + 2 * m; ph = ih + 2 * m; }
      else { const land = opts.orient === 'landscape' || (opts.orient === 'auto' && im.w > im.h); [pw, ph] = land ? [A4[1], A4[0]] : A4; }
      const s = Math.min((pw - 2 * m) / iw, (ph - 2 * m) / ih);
      const dw = iw * s, dh = ih * s; const page = doc.addPage([pw, ph]);
      page.drawImage(e, { x:(pw - dw) / 2, y:(ph - dh) / 2, width:dw, height:dh });
    }
    return doc.save();
  }
  async function pagesToPdf(pages){
    const doc = await PDFDocument.create();
    for (const p of pages){
      const e = await doc.embedJpg(p.bytes); const page = doc.addPage([p.wPt, p.hPt]);
      page.drawImage(e, { x:0, y:0, width:p.wPt, height:p.hPt });
    }
    return doc.save();
  }
  return { UserError, load, merge, pick, pickMany, parseRanges, stamp, imagesToPdf, pagesToPdf, norm };
}
/*CORE_END*/

const LIBS_OK = !!(window.PDFLib && window.pdfjsLib && window.Tesseract);
const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';
const Core = window.PDFLib ? makeCore(window.PDFLib) : null;
const UserErr = Core ? Core.UserError : Error;

const $ = (s, r = document) => r.querySelector(s);
function el(tag, props, ...kids){
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k === 'style') n.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)){ if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return n;
}

async function packFiles(files, zipName){

/* --- PDF 讀取與渲染 --- */
const PDFJS_OPTS = { isEvalSupported:false, cMapUrl:PDFJS_BASE + 'cmaps/', cMapPacked:true };
const openBytes = bytes => pdfjsLib.getDocument({ data:bytes.slice(), ...PDFJS_OPTS }).promise;
async function openPdf(file){
  const bytes = new Uint8Array(await file.arrayBuffer());
  if (String.fromCharCode(...bytes.slice(0, 1024)).indexOf('%PDF') < 0) throw new UserErr(`「${file.name}」不是 PDF 檔。`);
  let pdf;
  try { pdf = await openBytes(bytes); }
  catch(e){ throw new UserErr(`「${file.name}」無法讀取或有密碼保護。`); }
  try { await Core.load(bytes); } catch(e){ pdf.destroy(); throw new UserErr(`「${file.name}」：${e.message}`); }
  return { file, name:file.name, base:baseName(file.name), bytes, pdf, n:pdf.numPages };
}
async function renderPage(pdf, n, { maxDim, scale, longSide }){
  const page = await pdf.getPage(n); const v1 = page.getViewport({ scale:1 });
  const dpr = maxDim ? Math.min(2, window.devicePixelRatio || 1) + 0.5 : 1;
  let s = scale || 1;
  if (maxDim) s = (maxDim / Math.max(v1.width, v1.height)) * dpr;
  if (longSide) s = longSide / Math.max(v1.width, v1.height);
  const vp = page.getViewport({ scale:s });
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.floor(vp.width)); c.height = Math.max(1, Math.floor(vp.height));
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext:ctx, viewport:vp }).promise;
  page.cleanup();
  if (maxDim){ c.style.width = (c.width / dpr) + 'px'; c.style.height = (c.height / dpr) + 'px'; }
  return c;
}
const loaders = new Set();
function thumbLoader(pdf){
  let chain = Promise.resolve(), alive = true;
  const L = {
    add(n, holder, maxDim = 112, after){
      chain = chain.then(async () => {
        if (!alive) return;
        try { const c = await renderPage(pdf, n, { maxDim }); if (alive){ holder.replaceChildren(c); if (after) after(c); } }
        catch(e){ holder.replaceChildren(el('span', { class:'ph', text:'無法預覽' })); }
      });
    },
    done(){ return chain; }, alive(){ return alive; }, stop(){ alive = false; }
  };
  loaders.add(L); return L;
}
function stopLoaders(){ loaders.forEach(l => l.stop()); loaders.clear(); }

/* --- 重複偵測與圖片處理工具 --- */
function fingerprint(src){
  const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d', { willReadFrequently:true });
  x.fillStyle = '#fff'; x.fillRect(0, 0, 32, 32); x.drawImage(src, 0, 0, 32, 32);
  const d = x.getImageData(0, 0, 32, 32).data, g = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) g[i] = d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114;
  return g;
}
function fpDiff(a, b){ let s = 0; for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]); return s / a.length; }
function findDuplicates(entries){
  const res = new Map();
  for (let i = 0; i < entries.length; i++){
    const a = entries[i]; if (!a || !a.fp) continue;
    for (let j = 0; j < i; j++){
      const b = entries[j]; if (!b || !b.fp || res.has(j)) continue;
      if (Math.abs(a.ratio - b.ratio) > 0.02) continue;
      if (a.text || b.text){ if (a.text && a.text === b.text && fpDiff(a.fp, b.fp) < 12){ res.set(i, j); break; } continue; }
      if (fpDiff(a.fp, b.fp) < 3){ res.set(i, j); break; }
    }
  }
  return res;
}
async function pageText(pdf, n){ try { const p = await pdf.getPage(n); const t = await p.getTextContent(); return t.items.map(x => x.str).join('').replace(/\s+/g, ''); } catch(e){ return ''; } }
const FONT_STACK = '"Noto Serif TC", "Playfair Display", serif';
const canvasPng = async c => new Uint8Array(await (await toBlob(c, 'image/png')).arrayBuffer());

async function textStamp(text, { sizePt, color, angle, weight }){
  try { await document.fonts.load(`${weight} ${sizePt}px ${FONT_STACK}`, text); } catch(e){}
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = `${weight} ${sizePt}px ${FONT_STACK}`;
  const w1 = probe.measureText(text).width + sizePt * 0.2, h1 = sizePt * 1.35;
  const S = Math.max(1, Math.min(4, 3500 / Math.max(w1, h1)));
  const rad = angle * Math.PI / 180, cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
  const tw = w1 * S, th = h1 * S;
  const cw = Math.ceil(tw * cos + th * sin), ch = Math.ceil(tw * sin + th * cos);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const ctx = c.getContext('2d'); ctx.translate(cw / 2, ch / 2); ctx.rotate(-rad);
  ctx.font = `${weight} ${sizePt * S}px ${FONT_STACK}`;
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, 0);
  return { png:await canvasPng(c), w:cw / S, h:ch / S };
}

function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => res(img); img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}

async function imageStamp(img, angle){
  const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
  const iw = img.naturalWidth * k, ih = img.naturalHeight * k;
  const rad = angle * Math.PI / 180, cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
  const cw = Math.ceil(iw * cos + ih * sin), ch = Math.ceil(iw * sin + ih * cos);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const ctx = c.getContext('2d'); ctx.translate(cw / 2, ch / 2); ctx.rotate(-rad);
  ctx.drawImage(img, -iw / 2, -ih / 2, iw, ih);
  return { png:await canvasPng(c), w:cw, h:ch, srcW:iw };
}

// 增強版 imageToBytes 支援旋轉圖片處理
async function imageToBytes(file, rot = 0){
  const img = await loadImage(file);
  const k = Math.min(1, 4000 / Math.max(img.naturalWidth, img.naturalHeight));
  let w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  
  const c = document.createElement('canvas');
  let rad = 0;
  if (rot) {
    rad = (rot % 360) * Math.PI / 180;
    if (rot % 180 !== 0) { const tmp = w; w = h; h = tmp; } // 交換長寬
  }
  
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const isPng = file.type === 'image/png' || /\.png$/i.test(file.name);
  if (!isPng){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
  
  if (rot) {
    ctx.translate(w/2, h/2);
    ctx.rotate(rad);
    const origW = img.naturalWidth * k, origH = img.naturalHeight * k;
    ctx.drawImage(img, -origW/2, -origH/2, origW, origH);
  } else {
    ctx.drawImage(img, 0, 0, w, h);
  }
  
  URL.revokeObjectURL(img.src);
  const blob = await toBlob(c, isPng ? 'image/png' : 'image/jpeg', 0.92); c.width = c.height = 0;
  return { bytes:new Uint8Array(await blob.arrayBuffer()), kind:isPng ? 'png' : 'jpg', w, h };
}

function toPages(canvas, pageW, pageH, padTop, padBottom, padFirst){
  const ctx = canvas.getContext('2d', { willReadFrequently:true }); const pages = []; let y = 0, first = true;
  while (y < canvas.height - 2){
    const room = first && !padFirst ? pageH - padBottom : pageH - padTop - padBottom;
    let end = Math.min(y + room, canvas.height);
    if (end < canvas.height) { 
      const data = ctx.getImageData(0, y + room*0.7, canvas.width, end - (y + room*0.7)).data;
      let cutFound = end;
      for(let r = end - (y + room*0.7) - 1; r>=0; r--){ let blank=true; for(let x=0; x<canvas.width; x+=4){ const i = (r*canvas.width+x)*4; if(data[i]<238 || data[i+1]<238){ blank=false; break; } } if(blank){ cutFound = y + room*0.7 + r + 1; break; } }
      end = cutFound;
    }
    const p = document.createElement('canvas'); p.width = Math.round(pageW); p.height = Math.round(pageH);
    const px = p.getContext('2d'); px.fillStyle = '#fff'; px.fillRect(0, 0, p.width, p.height);
    const dy = first && !padFirst ? 0 : padTop;
    px.drawImage(canvas, 0, y, canvas.width, end - y, 0, dy, canvas.width, end - y);
    pages.push(p); y = end; first = false;
  }
  if (!pages.length){ const p = document.createElement('canvas'); p.width = Math.round(pageW); p.height = Math.round(pageH); p.getContext('2d').fillStyle='#fff'; p.getContext('2d').fillRect(0,0,p.width,p.height); p.getContext('2d').drawImage(canvas, 0, 0); pages.push(p); }

}

    function draw(){
      if (!items.length){ ws = null; stage.replaceChildren(up); setStep(1); return; }
      list.replaceChildren(...items.map((it, k) => 
        el('div', { class:'thumb', 'data-id':it.id }, 
          el('div', { class:'img' }, el('img', { class:'pv', src:it.url, style:`transform: rotate(${it.rot}deg);` })), 
          el('span', { class:'label', text:`P.${k + 1}` }), 
          el('div', { class:'ctls' }, 
             el('button', { class:'ctl', type:'button', onclick:() => { it.rot = (it.rot + 90) % 360; it.bytes = null; draw(); auto.run(); } }, '↻'),
             el('button', { class:'ctl', type:'button', onclick:() => { URL.revokeObjectURL(it.url); items.splice(k, 1); draw(); auto.run(); } }, '✕')
          )
        )
      ));
      
      const dups = findDuplicates(items.map(it => it.fp ? { fp:it.fp, ratio:it.ratio } : null));
      if (dups.size) {
        banner.className = 'banner warn show';
        banner.replaceChildren(el('span', {}, '偵測到 ', el('b', { text:`${dups.size} 張` }), ' 重複圖片。'),
         el('button', { class:'btn warn', style:'padding:6px 12px;', type:'button', onclick:() => { 
            const drop = new Set(dups.keys());
            for (let k = items.length - 1; k >= 0; k--) if (drop.has(k)){ URL.revokeObjectURL(items[k].url); items.splice(k, 1); }
            draw(); auto.run();
         } }, '移除重複'));
      } else {
        banner.className = 'banner'; banner.replaceChildren();
      }
    }
    stage.append(up); return page;
  },
  word2pdf(t){ return officeTool(t, 'word'); },
  excel2pdf(t){ return officeTool(t, 'excel'); },
  pdf2img(t){
    return singlePdfTool(t, '將文件中的每一頁匯出為高品質圖像。', 'preview', (doc, { ws, msg, setStep }) => {
      const viewer = Viewer('影像預覽');
      const ab = ActionBar('下載 ZIP 壓縮檔', async note => { const files = []; for (let k = 0; k < doc.n; k++){ note(`生成中：第 ${k + 1} 頁`); const c = await renderPage(doc.pdf, k + 1, { scale:2 }); files.push({ name:`${doc.base}_P${k+1}.jpg`, blob:await toBlob(c, 'image/jpeg', 0.9) }); c.width = c.height = 0; } const f = await packFiles(files, `${doc.base}_圖片集.zip`); if (await saveFile(f.name, f.blob)) setStep(3); }, msg);
      ws.main.append(el('h2', { class:'sec-title', text:'確認準備匯出' }), el('p', { class:'note', text:`即將為您匯出 ${doc.n} 張高解析度 JPG 圖片。` }), msg, ab.node); ws.side.append(viewer.node); viewer.setProvider({ count:doc.n, render:(i, m) => renderPage(doc.pdf, i + 1, { maxDim:m }) });
    });
  },
  ocr(t){
    const { page, stage, setStep } = toolShell(t, '使用 Tesseract.js 本地引擎，安全、快速地提取圖片或掃描文件中的文字。支援直接拍照。');
    const up = uploadCard({ 
      accept:'application/pdf,.pdf,image/*', multiple:false, label:'選擇 PDF 或相片', formats:'支援 PDF, JPG, PNG', onFiles:load,
      captureLabel: '直接拍照辨識', onCapture: load
    });
    const wrap = el('div', {}, up);
    async function load([f]){
      setMsg(up.msg, '解析中...', 'info'); let srcCanvas, title = baseName(f.name);
      try {
        if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf') { const doc = await openPdf(f); srcCanvas = await renderPage(doc.pdf, 1, { maxDim: 2000 }); }
        else { const im = new Image(); await new Promise((res, rej) => { im.onload = res; im.onerror = rej; im.src = URL.createObjectURL(f); }); srcCanvas = document.createElement('canvas'); srcCanvas.width = im.naturalWidth; srcCanvas.height = im.naturalHeight; srcCanvas.getContext('2d').drawImage(im, 0, 0); }
      } catch(e) { setMsg(up.msg, errText(e), 'err'); return; }
      
      const card = el('div', { class:'card ws ws-preview' }); const main = el('div', { class:'ws-main' }); const side = el('div', { class:'ws-side', style:'padding:40px; display:grid; place-items:center; align-content:center;' });
      const pvImg = el('img', { src: srcCanvas.toDataURL('image/jpeg', 0.8), style:'max-width:100%; max-height: 400px; box-shadow:var(--shadow);' }); side.append(pvImg);
      
      const status = el('div', { class:'serif', style:'color:var(--muted); margin-bottom:15px; font-size: 0.95rem;' }, '就緒，請點擊開始識別。');
      const ta = el('textarea', { class:'input', style:'min-height: 350px;' }); 
      
      const rotBtn = el('button', { class:'btn', style:'padding:15px 25px; font-size:1.2rem; flex:none;', type:'button', onclick:() => {
           const w = srcCanvas.width, h = srcCanvas.height;
           const nc = document.createElement('canvas'); nc.width = h; nc.height = w;
           const nx = nc.getContext('2d');
           nx.translate(h/2, w/2); nx.rotate(90 * Math.PI / 180);
           nx.drawImage(srcCanvas, -w/2, -h/2);
           srcCanvas = nc;
           pvImg.src = srcCanvas.toDataURL('image/jpeg', 0.8);
      }}, '↻');
      
      const startBtn = el('button', { class:'btn primary big block', type:'button' }, '提取文字');
      startBtn.onclick = async () => {
        startBtn.disabled = true; rotBtn.disabled = true;
        try {
          status.textContent = '正在載入 Tesseract.js 繁體中文模型...';
          const { data: { text } } = await Tesseract.recognize(srcCanvas, 'chi_tra+eng', { logger: m => { if (m.status === 'recognizing text') { status.textContent = `文字辨識中... ${Math.round(m.progress * 100)}%`; } else { status.textContent = `初始化 (${m.status})...`; } } });
          ta.value = text.trim(); status.textContent = '識別完成，您可以直接複製文字。'; setStep(3);
        } catch(e) { status.textContent = '識別過程發生錯誤。'; status.style.color = 'var(--err)'; } finally { startBtn.disabled = false; rotBtn.disabled = false; startBtn.textContent = '再次提取'; }
      };
      main.append(
          fileHead(title, '影像來源', () => { wrap.replaceChildren(up); setStep(1); }), 
          el('h2', { class:'sec-title', text:'文字識別結果' }), 
          status, ta, 
          el('div', { style:'display:flex; gap:15px; margin-top:20px;' }, rotBtn, startBtn)
      ); 
      card.append(main, side); wrap.replaceChildren(card); setStep(2);
    }
    stage.append(wrap); return page;
  }
};

/* --- 首頁與初始化 --- */
let homeFilter = 'all';
function home(){
  const hero = el('section', { class: 'editorial-hero' },
    el('div', { class: 'hero-left' },
      el('div', { class: 'hero-subtitle' }, 'Utilities'),
      el('h1', { class: 'hero-title serif' }, 'PDF 工具箱'),
      el('p', { class: 'hero-desc' }, '在您的瀏覽器內安全、優雅地處理 PDF 檔案。完全保護隱私，無須上傳，結合本地端 AI 文字識別技術。'),
      el('div', { class: 'hero-discover' }, el('span', { class: 'outline-text' }, '開始探索'), el('span', { class: 'thin-arrow' }, '⟶') )
    ),
    el('div', { class: 'hero-right' },
      el('div', { class: 'stamp' }, el('svg', { viewBox:'0 0 100 100' }, el('path', { d:'M 50,50 m -40,0 a 40,40 0 1,1 80,0 a 40,40 0 1,1 -80,0', fill:'none', id:'circle' }), el('text', { style:'font-family:"Playfair Display"; font-size:12px; letter-spacing:3px;' }, el('textPath', { href:'#circle' }, 'EVERYDAY • ANYWHERE •'))) ),
      el('div', { class: 'featured-card' },
        el('div', { class: 'fc-img' }),
        el('div', { class: 'fc-content' }, el('h3', { class: 'fc-title' }, '文字識別 (OCR)'), el('p', { class: 'fc-desc' }, '無需雲端 API，運用瀏覽器本地 AI 引擎，流暢提取掃描檔與圖片中的文字資訊。'), el('button', { class: 'fc-link', onclick: () => go('ocr') }, '前往體驗 ⟶') )
      )
    )
  );
  const toolsContainer = el('div', { class: 'container' }); const filters = el('div', { class: 'filters' });
  ['all', 'org', 'edit', 'to', 'ocr'].forEach(k => { filters.append(el('button', { class: 'pill', 'aria-pressed': String(homeFilter === k), onclick: () => { homeFilter = k; renderTiles(); } }, k === 'all' ? '全部工具' : CATS[k].name)); });
  const tilesGrid = el('div', { class: 'tiles' });
  function renderTiles() {
    tilesGrid.replaceChildren(...TOOLS.filter(t => homeFilter === 'all' || homeFilter === t.cat).map(t => el('button', { class: 'tile', onclick: () => go(t.id) }, el('div', { class: 'tile-head' }, el('span', { class: 'tile-title' }, t.name), t.isNew ? el('span', { class:'new' }, 'New') : null ), el('span', { class: 'tile-desc' }, t.desc) )));
    [...filters.children].forEach(btn => btn.setAttribute('aria-pressed', String(btn.textContent === (homeFilter==='all' ? '全部工具' : CATS[homeFilter].name))));
  }
  toolsContainer.append(el('div', { class: 'tools-header' }, el('h2', { class: 'serif' }, '工具系列')), filters, tilesGrid);
  renderTiles();
  return el('div', {}, topNav(), hero, el('section', { class: 'tools-section' }, toolsContainer), siteFoot());
}
function libError(){ return el('div', { class:'container', style:'padding-top:100px; text-align:center;' }, el('h1', { class:'serif', text:'系統無法連線' }), el('p', { style:'color:var(--muted); margin-top: 20px;', text:'必備的程式庫無法載入，請確認您的網路連線後重新整理頁面。' })); }
function go(id){ stopLoaders(); const app = $('#app'); if (!LIBS_OK){ app.replaceChildren(libError()); return; } const t = TOOLS.find(x => x.id === id); app.replaceChildren(t ? VIEWS[id](t) : home()); window.scrollTo(0, 0); }
setTimeout(() => go(null), 150);
</script>
